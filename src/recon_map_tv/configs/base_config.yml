# --- Project Paths ---
paths:
  # The directory where HDF5 system matrix files live
  hdf5_dir: "/vscratch/grp-rutaoyao/sid/data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4/outputs"
  # File list of system matrix paths (one per line)
  flist_path: "/vscratch/grp-rutaoyao/sid/data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4/outputs/dataset_flist.csv"
  # Input projection data (generated by fake_projection.py or real scan)
  projs_path: "/vscratch/grp-rutaoyao/sid/data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4/outputs/derenzo-projs.npy"
  # The input phantom for fake projections
  phantom_path: "../../custom_phantoms/hot_rods_phantom_10.0_mm_x_10.0_mm.pt"
  # Output reconstruction file
  recon_out_path: "/vscratch/grp-rutaoyao/sid/data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4/outputs/recon_map_tv.npz"
  # Tensor base layout path
  base_layout_path: "/vscratch/grp-rutaoyao/sid/data/scanner_layouts/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4.tensor"

# --- System Geometry ---
geometry:
  img_dim: 512        # FOV pixel dimension (e.g., 512x512)
  pixel_size_mm: 0.0195
  num_layouts: 1     # Number of projection layouts

# --- MAP-TV Algorithm Settings ---
map_tv:
  # --- Outer EM Loop ---
  n_outer: 60             # Outer EM iterations (20-60 recommended)
  convergence_tol: 1e-4   # Stop if ||x^k+1 - x^k|| / ||x^k|| < tol
  save_every: 5           # Save image snapshot every N outer iterations
  cache_data: true        # Cache all system matrices in RAM (requires ~32GB)

  # --- TV Regularization (most important tuning parameter) ---
  # Controls the compressive sensing sparsity constraint in the gradient domain.
  #   Too high -> blocky/cartoon-like image, small features erased
  #   Too low  -> behaves like standard ML-EM, noisy/grainy output
  # Start at 0.01-0.1 relative to the max intensity of an unregularized image.
  beta: 1

  # --- Inner Chambolle-Pock TV Proximal Solver ---
  n_inner: 30             # Inner TV iterations (10-30; diminishing returns beyond 30)

  # Primal step size (how aggressively x updates each inner step)
  tau: 0.25
  # Dual step size (how aggressively the edge-field p updates)
  # STABILITY CONSTRAINT: tau * sigma < 1/8 (=0.125) for 2D TV
  #                        tau * sigma < 1/12 (≈0.083) for 3D TV
  # Default: 0.25 * 0.25 = 0.0625 < 0.125 ✓
  sigma: 0.25

  # Extrapolation factor for over-relaxation (1.0 = standard Chambolle-Pock)
  theta: 1.0

  # Numerical floor: prevents division-by-zero in likelihood ratios / norms
  eps: 1.0e-6

  # Additive background (scatter + randoms). Set to 0.0 if not modelled.
  background: 0.0
