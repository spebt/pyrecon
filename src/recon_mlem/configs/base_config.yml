# --- Project Paths ---
paths:
  # The directory where system matrix (.tensor) and HDF5 files live
  data_dir: "../../../data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4"
  # The directory where HDF5 system matrix files live
  hdf5_dir: "../../../data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4/outputs"
  # File list of system matrix paths (one per line)
  flist_path: "../../../data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4/outputs/dataset_flist.csv"
  # Input projection data (generated by fake_projection.py or real scan)
  projs_path: "../../../data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4/outputs/derenzo-projs.npy"
  # Noisy projection output (generated by fake_projection_noisy.py)
  projs_noisy_path: "../../../data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4/outputs/derenzo-projs-noisy.npy"
  # The input phantom for fake projections
  phantom_path: "../../custom_phantoms/hot_rods_phantom_10.0_mm_x_10.0_mm_2.pt"
  # Output reconstruction file
  recon_out_path: "../../../data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4/outputs/recon_map_tv.npz"
  # Tensor base layout path
  base_layout_path: "../../../data/scanner_layouts/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4.tensor"

# --- System Geometry ---
geometry:
  img_dim: 512       # FOV pixel dimension (e.g., 512x512)
  pixel_size_mm: 0.0195
  num_layouts: 1    # Number of layouts after rotations/translations

# --- CNR Evaluation ---
cnr:
  shrink_px: 1   # shrink rod ROI inward by N pixels (reduces partial-volume bias)
  erode_px: 2    # erode background mask inward by N pixels (avoids edge artefacts)

# --- Poisson Noise Simulation ---
noise:
  seed: 42            # Fixed seed for reproducibility
  # Multiplicative factor applied to phantom activity before projection.
  # Higher values → more counts → less noise. Typical range: 100–10000.
  # Set to match expected total counts in your acquisition protocol.
  scale_factor: 1000.0

# --- MLEM Settings ---
mlem:
  iterations: 150
  convergence_tol: 1e-4
  save_every: 5      # Save estimate every N iterations
  cache_data: true   # Load all matrices into RAM (requires ~32GB)