# --- Project Paths ---
paths:
  # The directory where system matrix (.tensor) and HDF5 files live
  data_dir: "/vscratch/grp-rutaoyao/sid/data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4"
  # Subdirectory for HDF5 ppdf files
  hdf5_dir: "/vscratch/grp-rutaoyao/sid/data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4/outputs"
  # Where to save the file list CSV
  flist_path: "/vscratch/grp-rutaoyao/sid/data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4/outputs/dataset_flist.csv"
  # The input phantom for fake projections
  phantom_path: "../../custom_phantoms/hot_rods_phantom_10.0_mm_x_10.0_mm.pt"
  # Output file for generated projections
  projs_path: "/vscratch/grp-rutaoyao/sid/data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4/outputs/derenzo-projs.npy"
  # Output file for MLEM reconstruction
  recon_out_path: "/vscratch/grp-rutaoyao/sid/data/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4/outputs/recon_mlem_torch_optimized.npz"
  # Tensor base layout path
  base_layout_path: "/vscratch/grp-rutaoyao/sid/data/scanner_layouts/hybrid_sc_spect_mph_biconical_base_72_2.5_0.4.tensor"
# --- System Geometry ---
geometry:
  img_dim: 512       # FOV pixel dimension (e.g., 512x512)
  pixel_size_mm: 0.0195
  num_layouts: 1    # Number of layouts after rotations/translations

# --- MLEM Settings ---
mlem:
  iterations: 150
  convergence_tol: 1e-4
  save_every: 5      # Save estimate every N iterations
  cache_data: true   # Load all matrices into RAM (requires ~32GB)